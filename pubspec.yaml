name: fixit
description: "A home-repair assistant that answers with interactive Flutter UI, built on genui and Gemini."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  a2ui_core: 0.1.1
  collection: ^1.19.1
  dio: ^5.11.1
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  # Pre-1.0 and changing quickly; upgraded by hand (see docs/ARCHITECTURE.md).
  genui: 0.10.4
  go_router: ^18.0.2
  image: ^4.10.1
  image_picker: ^1.2.3
  intl: ^0.20.2
  json_annotation: ^4.12.0
  json_schema_builder: ^0.1.7
  path: ^1.9.1
  path_provider: ^2.1.6
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_test:
    sdk: flutter
  # 4.0 stable needs Dart 3.13; this is the newest build that runs on the
  # Dart 3.12 toolchain alongside drift_dev 2.35. Revisit on the next
  # Flutter stable.
  freezed: 4.0.0-dev.3
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  very_good_analysis: ^10.3.0

flutter:
  generate: true
  uses-material-design: true
