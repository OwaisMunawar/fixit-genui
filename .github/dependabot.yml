version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Pre-1.0 and changing quickly. Upgraded by hand against its changelog.
      - dependency-name: genui
      # freezed 4.0 stable needs a newer Dart than Flutter 3.44 ships.
      - dependency-name: freezed
      - dependency-name: freezed_annotation
      - dependency-name: a2ui_core
      # Pinned by flutter_localizations in the Flutter SDK.
      - dependency-name: intl
      # Riverpod 3.5 pulls packages that do not resolve on Flutter 3.44.
      - dependency-name: flutter_riverpod
        update-types: ['version-update:semver-minor']
      - dependency-name: riverpod
        update-types: ['version-update:semver-minor']
      - dependency-name: build_runner
        update-types: ['version-update:semver-minor']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      actions:
        patterns:
          - '*'
